<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LensTranslate – Translate with your camera</title>
<style>
  :root { --bg:#000; --fg:#fff; --muted:#a8adb7; --accent:#4ade80; --panel:rgba(18,20,26,.92); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  video, #result { width:100%; height:100%; object-fit:contain; background:#000; }
  #result { display:none; }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    display:flex; gap:8px; align-items:center; background:linear-gradient(#000c,#0000); z-index:5; }
  .top label { flex:1; min-width:0; font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:2px; }
  select { width:100%; background:#1b1e26; color:var(--fg); border:1px solid #333948; border-radius:10px;
    padding:9px 8px; font-size:15px; }
  .swap { flex:none; width:36px; height:36px; border-radius:50%; border:1px solid #333948; background:#1b1e26;
    color:var(--fg); font-size:18px; margin-top:14px; }
  .bottom { position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:14px 20px calc(env(safe-area-inset-bottom) + 18px);
    display:flex; align-items:center; justify-content:space-between; background:linear-gradient(#0000,#000d); }
  .icon { width:52px; height:52px; border-radius:50%; border:1px solid #444b5c; background:#1b1e26cc;
    color:var(--fg); font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #shutter { width:76px; height:76px; border-radius:50%; border:4px solid #fff; background:#fff3; padding:0; position:relative; }
  #shutter::after { content:""; position:absolute; inset:6px; border-radius:50%; background:#fff; transition:transform .1s; }
  #shutter:active::after { transform:scale(.88); }
  #shutter:disabled { opacity:.4; }
  #status { position:fixed; left:50%; top:40%; transform:translateX(-50%); z-index:6; background:var(--panel);
    padding:12px 18px; border-radius:14px; display:none; text-align:center; max-width:86%; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid #fff4; border-top-color:var(--accent);
    border-radius:50%; animation:r .8s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes r { to { transform:rotate(360deg);} }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:7; max-height:46vh; overflow:auto; display:none;
    background:var(--panel); border-radius:20px 20px 0 0; padding:16px 18px calc(env(safe-area-inset-bottom) + 16px);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #sheet h3 { margin:0 0 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  #text { white-space:pre-wrap; font-size:18px; }
  .row { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; padding:12px; border-radius:12px; border:0; font-size:16px; font-weight:600; cursor:pointer; }
  .primary { background:var(--accent); color:#04210f; }
  .ghost { background:#272b36; color:var(--fg); }
  #perm { position:fixed; inset:0; z-index:8; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:30px; gap:14px; background:#0b0d12; }
  #perm p { color:var(--muted); max-width:340px; margin:0; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="result"></canvas>
</div>

<div class="top">
  <label>Text is in
    <select id="src"></select>
  </label>
  <button class="swap" id="swap" title="Swap languages" aria-label="Swap languages">⇄</button>
  <label>Translate to
    <select id="dst"></select>
  </label>
</div>

<div id="status"></div>

<div id="sheet">
  <h3>Translation</h3>
  <div id="text"></div>
  <div class="row">
    <button class="btn ghost" id="copy">Copy</button>
    <button class="btn primary" id="again">Scan again</button>
  </div>
</div>

<div class="bottom" id="controls">
  <label class="icon" title="Choose a photo" aria-label="Choose a photo">🖼<input type="file" id="file" accept="image/*"></label>
  <button id="shutter" aria-label="Take photo and translate"></button>
  <button class="icon" id="flip" aria-label="Switch camera">🔄</button>
</div>

<div id="perm">
  <div style="font-size:48px">📷</div>
  <h2 style="margin:0">Camera needed</h2>
  <p id="permMsg">Allow camera access to translate what you see. Nothing is uploaded except the text to translate.</p>
  <button class="btn primary" id="retry" style="flex:none;width:220px">Enable camera</button>
  <label class="btn ghost" style="flex:none;width:220px;text-align:center">Use a photo instead
    <input type="file" id="file2" accept="image/*" capture="environment">
  </label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
// name, tesseract code, translate code
const LANGS = [
  ["English","eng","en"],["Spanish","spa","es"],["French","fra","fr"],["German","deu","de"],
  ["Italian","ita","it"],["Portuguese","por","pt"],["Dutch","nld","nl"],["Polish","pol","pl"],
  ["Turkish","tur","tr"],["Indonesian","ind","id"],["Malay","msa","ms"],["Vietnamese","vie","vi"],
  ["Russian","rus","ru"],["Ukrainian","ukr","uk"],["Arabic","ara","ar"],["Hindi","hin","hi"],
  ["Bengali","ben","bn"],["Thai","tha","th"],["Chinese (Simplified)","chi_sim","zh-CN"],
  ["Chinese (Traditional)","chi_tra","zh-TW"],["Japanese","jpn","ja"],["Korean","kor","ko"]
];
const AUTO_OCR = "eng+spa+fra+deu+ita+por";   // Latin-script auto mode

const $ = id => document.getElementById(id);
const video=$("video"), result=$("result"), srcSel=$("src"), dstSel=$("dst");
let stream=null, facing="environment", busy=false;
const workers = {};
const cache = {};

// ---------- language pickers ----------
srcSel.innerHTML = `<option value="auto">Auto (Latin scripts)</option>` +
  LANGS.map((l,i)=>`<option value="${i}">${l[0]}</option>`).join("");
dstSel.innerHTML = LANGS.map((l,i)=>`<option value="${i}">${l[0]}</option>`).join("");

function load(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const nav = (navigator.language||"en").split("-")[0].toLowerCase();
const guess = LANGS.findIndex(l=>l[2].toLowerCase()===nav || l[2].toLowerCase().startsWith(nav));
srcSel.value = load("src","auto");
dstSel.value = load("dst", String(guess>=0?guess:0));
srcSel.onchange = ()=>save("src",srcSel.value);
dstSel.onchange = ()=>save("dst",dstSel.value);
$("swap").onclick = ()=>{
  if (srcSel.value==="auto") return;
  const a=srcSel.value; srcSel.value=dstSel.value; dstSel.value=a;
  srcSel.onchange(); dstSel.onchange();
};

// ---------- camera ----------
async function startCamera(){
  stopCamera();
  if (!navigator.mediaDevices?.getUserMedia){
    return showPerm("Your browser can't open the camera here (it needs a secure https page). You can still pick or take a photo below.");
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080} }, audio:false });
    video.srcObject = stream;
    $("perm").style.display="none";
    await video.play().catch(()=>{});
  }catch(e){
    showPerm(e.name==="NotAllowedError"
      ? "Camera access was blocked. Allow it in your browser's site settings, then tap Enable camera."
      : "Couldn't start the camera ("+e.name+"). You can use a photo instead.");
  }
}
function stopCamera(){ stream?.getTracks().forEach(t=>t.stop()); stream=null; }
function showPerm(msg){ $("permMsg").textContent=msg; $("perm").style.display="flex"; }
$("retry").onclick = startCamera;
$("flip").onclick = ()=>{ facing = facing==="environment"?"user":"environment"; startCamera(); };

// ---------- status ----------
function status(msg, spin=true){
  const s=$("status");
  if(!msg){ s.style.display="none"; return; }
  s.innerHTML = (spin?'<span class="spin"></span>':'') + msg; s.style.display="block";
}

// ---------- capture ----------
function frameToCanvas(source, w, h){
  const max=1800, k=Math.min(1, max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext("2d").drawImage(source,0,0,c.width,c.height); return c;
}
$("shutter").onclick = ()=>{
  if(busy || !video.videoWidth) return;
  process(frameToCanvas(video, video.videoWidth, video.videoHeight));
};
async function fromFile(f){
  if(!f) return;
  const bmp = await createImageBitmap(f).catch(()=>null);
  if(!bmp){ status("Couldn't read that image.",false); setTimeout(()=>status(),2000); return; }
  $("perm").style.display="none";
  process(frameToCanvas(bmp,bmp.width,bmp.height));
}
$("file").onchange = e=>{ fromFile(e.target.files[0]); e.target.value=""; };
$("file2").onchange = e=>{ fromFile(e.target.files[0]); e.target.value=""; };

// ---------- OCR ----------
async function getWorker(code){
  if(!workers[code]) workers[code] = Tesseract.createWorker(code, 1, {
    logger:m=>{ if(m.status==="recognizing text") status(`Reading text… ${Math.round(m.progress*100)}%`); else if(m.status) status("Loading language data…"); }
  });
  return workers[code];
}

// ---------- translation (MyMemory free API) ----------
async function translate(text, from, to){
  const key = from+"|"+to+"|"+text;
  if(cache[key]) return cache[key];
  const pair = (from==="auto"?"Autodetect":from)+"|"+to;
  const r = await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(pair));
  const j = await r.json();
  let t = j?.responseData?.translatedText;
  if(!t || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) throw new Error(/WARNING/i.test(t||"")?"quota":"fail");
  const tmp=document.createElement("textarea"); tmp.innerHTML=t; t=tmp.value; // decode entities
  return cache[key]=t;
}
async function pool(items, n, fn){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:n},async()=>{ while(i<items.length){ const k=i++; out[k]=await fn(items[k],k); } }));
  return out;
}

// ---------- main ----------
async function process(canvas){
  busy=true; $("shutter").disabled=true;
  const sIdx = srcSel.value, d = LANGS[+dstSel.value];
  const ocrCode = sIdx==="auto"?AUTO_OCR:LANGS[+sIdx][1];
  const from = sIdx==="auto"?"auto":LANGS[+sIdx][2];

  showResult(canvas);
  try{
    status("Loading language data…");
    const w = await getWorker(ocrCode);
    const { data } = await w.recognize(canvas);
    const lines = (data.lines||[]).filter(l=>l.text.trim().length>1 && l.confidence>35);
    if(!lines.length){ status("No text found. Try getting closer or choosing the right language.",false); setTimeout(()=>status(),3000); reset(false); return; }

    status("Translating…");
    let failed=false;
    const tr = await pool(lines, 4, async l=>{
      const src=l.text.replace(/\s+/g," ").trim();
      if(from!=="auto" && from===d[2]) return src;
      try{ return await translate(src, from, d[2]); }catch(e){ failed=e.message; return src; }
    });
    drawOverlay(canvas, lines, tr);
    $("text").textContent = tr.join("\n");
    $("sheet").style.display="block";
    status(failed==="quota" ? "Free daily translation limit reached. Try again later." : failed ? "Some lines couldn't be translated (check your connection)." : "", false);
    if(failed) setTimeout(()=>status(),3500);
  }catch(e){
    console.error(e);
    status("Something went wrong. Check your connection and try again.",false);
    setTimeout(()=>status(),3000); reset(false);
  }
  busy=false;
}

function showResult(c){
  result.width=c.width; result.height=c.height;
  result.getContext("2d").drawImage(c,0,0);
  result.style.display="block"; video.style.display="none";
  $("controls").style.display="none";
}
function reset(){
  result.style.display="none"; video.style.display="block";
  $("sheet").style.display="none"; $("controls").style.display="flex";
  $("shutter").disabled=false; busy=false;
  if(!stream) startCamera();
}
$("again").onclick = ()=>{ status(); reset(); };
$("copy").onclick = async ()=>{
  try{ await navigator.clipboard.writeText($("text").textContent); $("copy").textContent="Copied ✓"; }
  catch(e){ $("copy").textContent="Select & copy manually"; }
  setTimeout(()=>$("copy").textContent="Copy",1500);
};

function drawOverlay(canvas, lines, tr){
  const ctx = result.getContext("2d");
  ctx.drawImage(canvas,0,0);
  ctx.textBaseline="top";
  lines.forEach((l,i)=>{
    const {x0,y0,x1,y1}=l.bbox, w=Math.max(x1-x0,40), h=y1-y0;
    let size=Math.max(12, Math.min(h*0.85, 56));
    const text=tr[i];
    ctx.font=`600 ${size}px system-ui,sans-serif`;
    // wrap
    const wrap=(s)=>{ const words=s.split(/(\s+)/), out=[]; let cur="";
      for(const wd of words){ if(ctx.measureText(cur+wd).width>w-8 && cur){ out.push(cur.trim()); cur=wd.trimStart(); } else cur+=wd; }
      if(cur.trim()) out.push(cur.trim()); return out; };
    let rows=wrap(text);
    while(rows.length*size*1.15>Math.max(h,size)*2.2 && size>12){ size-=1; ctx.font=`600 ${size}px system-ui,sans-serif`; rows=wrap(text); }
    const bh=rows.length*size*1.15+8;
    ctx.fillStyle="rgba(0,0,0,.96)"; ctx.fillRect(x0-2,y0-2,w+4,Math.max(bh,h+4));
    ctx.fillStyle="#fff";
    rows.forEach((r,k)=>ctx.fillText(r,x0+4,y0+2+k*size*1.15,w-6));
  });
}

startCamera();
</script>
</body>
</html>
